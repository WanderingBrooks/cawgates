name: Deploy to homelab

on:
  push:
    branches:
      - trunk

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and redeploy
    runs-on: [self-hosted, homelab]

    steps:
      # Plain git instead of actions/checkout, so no third-party action code
      # runs on the homelab (a moved tag could otherwise reach Docker here).
      # The repo is public, so fetching needs no token. Checks out the exact
      # commit that triggered the run, then removes stray files, as
      # actions/checkout does.
      - name: Checkout repo
        run: |
          git init -q .
          git fetch --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git reset --hard FETCH_HEAD
          git clean -ffdx

      - name: Build app image
        run: docker build -t cawgates:latest .

      - name: Build migration image
        run: docker build --target=builder -t cawgates:migrate .

      - name: Migrate and deploy
        run: /home/jason/homelab-docker-compose/deploy-cawgates.sh
